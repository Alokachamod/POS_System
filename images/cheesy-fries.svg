<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFE082"/>
    </linearGradient>
    <linearGradient id="fry" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="cheeseMelt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="265" rx="130" ry="18" fill="#000" opacity="0.12"/>

  <!-- Boat tray -->
  <path d="M70 205 L330 205 L310 255 L90 255 Z" fill="#D32F2F"/>
  <path d="M70 205 Q200 215 330 205 L320 220 Q200 230 80 220 Z" fill="#9B0000"/>

  <!-- Fries in tray -->
  <rect x="100" y="160" width="16" height="70" rx="3" transform="rotate(-35 100 160)" fill="url(#fry)"/>
  <rect x="125" y="140" width="18" height="85" rx="3" transform="rotate(-20 125 140)" fill="url(#fry)"/>
  <rect x="155" y="125" width="18" height="95" rx="3" transform="rotate(-10 155 125)" fill="url(#fry)"/>
  <rect x="185" y="120" width="18" height="100" rx="3" transform="rotate(0 185 120)" fill="url(#fry)"/>
  <rect x="215" y="125" width="18" height="95" rx="3" transform="rotate(12 215 125)" fill="url(#fry)"/>
  <rect x="245" y="135" width="18" height="90" rx="3" transform="rotate(22 245 135)" fill="url(#fry)"/>
  <rect x="270" y="155" width="16" height="75" rx="3" transform="rotate(35 270 155)" fill="url(#fry)"/>

  <!-- Gooey Melted Cheese Drizzle -->
  <path d="M95 190 Q120 165 160 175 Q190 155 225 170 Q260 160 295 185 Q285 205 260 195 Q235 215 205 195 Q170 220 135 195 Q110 210 95 190 Z" fill="url(#cheeseMelt)"/>
  <circle cx="140" cy="180" r="3" fill="#D32F2F"/> <!-- Bacon bit -->
  <circle cx="180" cy="170" r="3.5" fill="#388E3C"/> <!-- Spring onion -->
  <circle cx="215" cy="182" r="3" fill="#D32F2F"/>
  <circle cx="250" cy="175" r="4" fill="#388E3C"/>
  <circle cx="165" cy="190" r="2.5" fill="#388E3C"/>
</svg>