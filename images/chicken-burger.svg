<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="100%" stop-color="#FFF9C4"/>
    </linearGradient>
    <linearGradient id="crispy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="100%" stop-color="#B95C08"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="255" rx="140" ry="20" fill="#000" opacity="0.12"/>
  <!-- Bottom bun -->
  <path d="M100 215 Q200 220 300 215 C300 245 280 252 200 252 C120 252 100 245 100 215 Z" fill="#DE801B"/>
  <!-- Mayo sauce -->
  <path d="M110 212 Q200 216 290 212" stroke="#FFFDD0" stroke-width="8" stroke-linecap="round"/>
  <!-- Crispy Fried Chicken Patty -->
  <path d="M92 185 Q115 170 145 188 Q180 168 215 185 Q250 172 280 188 Q305 180 308 198 Q280 212 250 205 Q210 216 175 204 Q135 215 95 202 Z" fill="url(#crispy)"/>
  <!-- Crispy texture flakes -->
  <circle cx="130" cy="190" r="3" fill="#D35400"/>
  <circle cx="170" cy="185" r="4" fill="#F39C12"/>
  <circle cx="210" cy="195" r="3" fill="#D35400"/>
  <circle cx="260" cy="190" r="3.5" fill="#F39C12"/>
  <!-- Pickles -->
  <ellipse cx="150" cy="172" rx="30" ry="8" fill="#2E7D32"/>
  <ellipse cx="250" cy="172" rx="30" ry="8" fill="#388E3C"/>
  <!-- Cabbage Slaw / Lettuce -->
  <path d="M95 168 C120 176 140 160 165 170 C190 162 215 174 240 162 C265 174 285 160 305 168" fill="none" stroke="#81C784" stroke-width="8" stroke-linecap="round"/>
  <!-- Top Bun -->
  <path d="M95 150 C95 80 140 60 200 60 C260 60 305 80 305 150 Z" fill="#E58E26"/>
  <ellipse cx="145" cy="95" rx="3" ry="6" transform="rotate(-15 145 95)" fill="#FFE0B2"/>
  <ellipse cx="195" cy="80" rx="3" ry="6" transform="rotate(10 195 80)" fill="#FFE0B2"/>
  <ellipse cx="245" cy="85" rx="3" ry="6" transform="rotate(-20 245 85)" fill="#FFE0B2"/>
  <ellipse cx="170" cy="110" rx="3" ry="6" transform="rotate(20 170 110)" fill="#FFE0B2"/>
  <ellipse cx="225" cy="115" rx="3" ry="6" transform="rotate(-10 225 115)" fill="#FFE0B2"/>
</svg>