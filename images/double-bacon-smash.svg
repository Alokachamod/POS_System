<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262224"/>
      <stop offset="100%" stop-color="#141113"/>
    </linearGradient>
    <linearGradient id="bun2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e38"/>
      <stop offset="100%" stop-color="#ba6012"/>
    </linearGradient>
    <linearGradient id="patty2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#542410"/>
      <stop offset="100%" stop-color="#331407"/>
    </linearGradient>
    <linearGradient id="bacon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b71c1c"/>
      <stop offset="30%" stop-color="#d32f2f"/>
      <stop offset="50%" stop-color="#ffcdd2"/>
      <stop offset="70%" stop-color="#c62828"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bg2)"/>
  <circle cx="200" cy="150" r="115" fill="#ffc107" opacity="0.12"/>

  <g filter="url(#shadow2)">
    <!-- Bottom Bun -->
    <path d="M 115 220 C 115 235, 285 235, 285 220 L 285 210 L 115 210 Z" fill="url(#bun2)"/>

    <!-- Bottom Patty 1 -->
    <rect x="105" y="194" width="190" height="18" rx="8" fill="url(#patty2)"/>

    <!-- Cheese 1 -->
    <path d="M 108 194 L 292 194 L 280 205 L 255 198 L 235 210 L 205 197 L 180 210 L 150 197 L 125 208 Z" fill="#ffb300"/>

    <!-- Top Patty 2 -->
    <rect x="105" y="174" width="190" height="18" rx="8" fill="url(#patty2)"/>

    <!-- Melted Cheese 2 -->
    <path d="M 108 174 L 292 174 L 270 188 L 245 178 L 220 192 L 195 178 L 165 192 L 140 178 L 118 188 Z" fill="#ffd54f"/>

    <!-- Crispy Bacon Strip 1 -->
    <path d="M 95 160 Q 140 148, 185 162 T 275 160 T 310 165 L 305 173 Q 265 168, 225 172 T 135 168 Z" fill="url(#bacon)"/>

    <!-- Crispy Bacon Strip 2 -->
    <path d="M 90 166 Q 140 178, 190 164 T 280 168 T 315 162 L 310 156 Q 260 160, 210 154 T 120 160 Z" fill="url(#bacon)"/>

    <!-- Onion rings/sauce accent -->
    <ellipse cx="160" cy="148" rx="28" ry="6" fill="none" stroke="#ba68c8" stroke-width="4" opacity="0.8"/>
    <ellipse cx="235" cy="147" rx="30" ry="6" fill="none" stroke="#ba68c8" stroke-width="4" opacity="0.8"/>

    <!-- Top Bun -->
    <path d="M 110 140 C 110 65, 290 65, 290 140 Z" fill="url(#bun2)"/>

    <!-- Sesame Seeds -->
    <ellipse cx="155" cy="95" rx="3.5" ry="2" fill="#fff9c4" transform="rotate(-10 155 95)"/>
    <ellipse cx="190" cy="85" rx="3.5" ry="2" fill="#fff9c4" transform="rotate(8 190 85)"/>
    <ellipse cx="230" cy="90" rx="3.5" ry="2" fill="#fff9c4" transform="rotate(22 230 90)"/>
    <ellipse cx="135" cy="115" rx="3.5" ry="2" fill="#fff9c4" transform="rotate(-25 135 115)"/>
    <ellipse cx="180" cy="110" rx="3.5" ry="2" fill="#fff9c4" transform="rotate(2 180 110)"/>
    <ellipse cx="220" cy="110" rx="3.5" ry="2" fill="#fff9c4" transform="rotate(-12 220 110)"/>
    <ellipse cx="260" cy="115" rx="3.5" ry="2" fill="#fff9c4" transform="rotate(28 260 115)"/>
  </g>
</svg>
