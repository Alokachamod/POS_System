<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27231f"/>
      <stop offset="100%" stop-color="#14110e"/>
    </linearGradient>
    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="40%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bg6)"/>
  <circle cx="200" cy="150" r="115" fill="#ffb300" opacity="0.12"/>

  <!-- Wooden serving board plate -->
  <ellipse cx="200" cy="225" rx="150" ry="38" fill="#3e2723" opacity="0.6"/>
  <ellipse cx="200" cy="220" rx="146" ry="35" fill="#4e342e"/>
  <ellipse cx="200" cy="216" rx="140" ry="32" fill="#5d4037"/>

  <g filter="url(#shadow6)">
    <!-- Onion Ring 1 (Back left) -->
    <g transform="translate(145, 175) rotate(-22)">
      <ellipse cx="0" cy="0" rx="55" ry="32" fill="none" stroke="url(#ringGold)" stroke-width="22"/>
      <ellipse cx="0" cy="0" rx="55" ry="32" fill="none" stroke="#ffe082" stroke-width="4" opacity="0.6"/>
      <!-- Crumbs -->
      <circle cx="-35" cy="-10" r="1.5" fill="#ffe082"/>
      <circle cx="20" cy="15" r="1.5" fill="#ffe082"/>
    </g>

    <!-- Onion Ring 2 (Back right) -->
    <g transform="translate(250, 172) rotate(25)">
      <ellipse cx="0" cy="0" rx="50" ry="30" fill="none" stroke="url(#ringGold)" stroke-width="22"/>
      <ellipse cx="0" cy="0" rx="50" ry="30" fill="none" stroke="#ffe082" stroke-width="4" opacity="0.6"/>
      <circle cx="-15" cy="18" r="1.5" fill="#ffe082"/>
      <circle cx="25" cy="-12" r="1.5" fill="#ffe082"/>
    </g>

    <!-- Onion Ring 3 (Center base) -->
    <g transform="translate(195, 185) rotate(-5)">
      <ellipse cx="0" cy="0" rx="60" ry="35" fill="none" stroke="url(#ringGold)" stroke-width="24"/>
      <ellipse cx="0" cy="0" rx="60" ry="35" fill="none" stroke="#ffe082" stroke-width="5" opacity="0.6"/>
      <circle cx="-25" cy="20" r="1.5" fill="#ffe082"/>
      <circle cx="35" cy="8" r="1.5" fill="#ffe082"/>
    </g>

    <!-- Onion Ring 4 (Stacked leaning) -->
    <g transform="translate(190, 140) rotate(-15)">
      <ellipse cx="0" cy="0" rx="52" ry="30" fill="none" stroke="url(#ringGold)" stroke-width="22"/>
      <ellipse cx="0" cy="0" rx="52" ry="30" fill="none" stroke="#ffe082" stroke-width="4" opacity="0.7"/>
      <circle cx="-20" cy="-15" r="1.5" fill="#ffe082"/>
      <circle cx="15" cy="18" r="1.5" fill="#ffe082"/>
    </g>

    <!-- Onion Ring 5 (Top of stack) -->
    <g transform="translate(210, 105) rotate(18)">
      <ellipse cx="0" cy="0" rx="46" ry="26" fill="none" stroke="url(#ringGold)" stroke-width="20"/>
      <ellipse cx="0" cy="0" rx="46" ry="26" fill="none" stroke="#ffe082" stroke-width="4" opacity="0.8"/>
      <circle cx="-10" cy="-12" r="1.5" fill="#ffe082"/>
      <circle cx="18" cy="10" r="1.5" fill="#ffe082"/>
    </g>

    <!-- Dipping Sauce Cup (Bottom Left) -->
    <g transform="translate(90, 205)">
      <ellipse cx="25" cy="22" rx="26" ry="14" fill="#37474f"/>
      <path d="M 0 10 L 4 24 C 5 32, 45 32, 46 24 L 50 10 Z" fill="#cfd8dc"/>
      <ellipse cx="25" cy="10" rx="25" ry="12" fill="#eceff1"/>
      <ellipse cx="25" cy="10" rx="21" ry="9" fill="#ff5722"/>
      <ellipse cx="22" cy="9" rx="14" ry="5" fill="#ff8a65" opacity="0.6"/>
      <circle cx="25" cy="10" r="1.5" fill="#2e7d32"/>
    </g>

    <!-- Parsley flakes scattered -->
    <circle cx="155" cy="135" r="1.8" fill="#2e7d32"/>
    <circle cx="178" cy="170" r="2" fill="#2e7d32"/>
    <circle cx="225" cy="130" r="1.8" fill="#2e7d32"/>
    <circle cx="245" cy="185" r="2" fill="#2e7d32"/>
    <circle cx="198" cy="95" r="1.8" fill="#2e7d32"/>
  </g>
</svg>
