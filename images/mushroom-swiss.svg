<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b231d"/>
      <stop offset="100%" stop-color="#14100d"/>
    </linearGradient>
    <linearGradient id="bun4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5a64b"/>
      <stop offset="100%" stop-color="#be6214"/>
    </linearGradient>
    <linearGradient id="patty4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5d2a14"/>
      <stop offset="100%" stop-color="#371507"/>
    </linearGradient>
    <linearGradient id="swiss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ede7d9"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bg4)"/>
  <circle cx="200" cy="150" r="115" fill="#8d6e63" opacity="0.14"/>

  <g filter="url(#shadow4)">
    <!-- Bottom Bun -->
    <path d="M 120 205 C 120 220, 280 220, 280 205 L 280 195 L 120 195 Z" fill="url(#bun4)"/>

    <!-- Beef Patty -->
    <rect x="110" y="172" width="180" height="24" rx="10" fill="url(#patty4)"/>

    <!-- Melted Swiss Cheese Drips -->
    <path d="M 112 173 L 288 173 L 275 188 L 250 178 L 225 198 L 205 178 L 175 196 L 155 178 L 135 192 Z" fill="url(#swiss)"/>
    <!-- Swiss Cheese eyes/holes -->
    <circle cx="155" cy="184" r="2.5" fill="#d7ccc8" opacity="0.7"/>
    <circle cx="218" cy="186" r="3" fill="#d7ccc8" opacity="0.7"/>
    <circle cx="265" cy="182" r="2" fill="#d7ccc8" opacity="0.7"/>

    <!-- Sautéed Mushrooms -->
    <!-- Mushroom 1 -->
    <g transform="translate(130, 150) rotate(-15)">
      <path d="M 0 10 C 0 2, 22 2, 22 10 Z" fill="#6d4c41"/>
      <rect x="8" y="10" width="6" height="8" rx="2" fill="#d7ccc8"/>
    </g>

    <!-- Mushroom 2 -->
    <g transform="translate(170, 146) rotate(5)">
      <path d="M 0 12 C 0 2, 26 2, 26 12 Z" fill="#5d4037"/>
      <rect x="10" y="12" width="6" height="9" rx="2" fill="#d7ccc8"/>
    </g>

    <!-- Mushroom 3 -->
    <g transform="translate(210, 148) rotate(-8)">
      <path d="M 0 11 C 0 2, 24 2, 24 11 Z" fill="#6d4c41"/>
      <rect x="9" y="11" width="6" height="8" rx="2" fill="#d7ccc8"/>
    </g>

    <!-- Mushroom 4 -->
    <g transform="translate(245, 152) rotate(18)">
      <path d="M 0 10 C 0 2, 22 2, 22 10 Z" fill="#5d4037"/>
      <rect x="8" y="10" width="6" height="7" rx="2" fill="#d7ccc8"/>
    </g>

    <!-- Caramelized Onion Glaze -->
    <path d="M 115 152 Q 145 145 175 154 Q 210 146 245 155 Q 270 148 285 153" stroke="#8d6e63" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Top Bun -->
    <path d="M 115 142 C 115 72, 285 72, 285 142 Z" fill="url(#bun4)"/>

    <!-- Poppy / Sesame Seeds -->
    <ellipse cx="160" cy="100" rx="3" ry="1.8" fill="#3e2723" transform="rotate(-15 160 100)"/>
    <ellipse cx="195" cy="90" rx="3" ry="1.8" fill="#3e2723" transform="rotate(10 195 90)"/>
    <ellipse cx="230" cy="98" rx="3" ry="1.8" fill="#3e2723" transform="rotate(25 230 98)"/>
    <ellipse cx="140" cy="120" rx="3" ry="1.8" fill="#3e2723" transform="rotate(-30 140 120)"/>
    <ellipse cx="178" cy="115" rx="3" ry="1.8" fill="#3e2723" transform="rotate(5 178 115)"/>
    <ellipse cx="215" cy="116" rx="3" ry="1.8" fill="#3e2723" transform="rotate(-10 215 116)"/>
    <ellipse cx="255" cy="120" rx="3.5" ry="2" fill="#fff9c4" transform="rotate(30 255 120)"/>
  </g>
</svg>
