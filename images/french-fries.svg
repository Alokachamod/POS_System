<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFE082"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#C1121F"/>
    </linearGradient>
    <linearGradient id="fry" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="265" rx="110" ry="16" fill="#000" opacity="0.12"/>
  
  <!-- Back fries -->
  <rect x="145" y="60" width="18" height="120" rx="3" transform="rotate(-15 145 60)" fill="url(#fry)"/>
  <rect x="175" y="45" width="18" height="135" rx="3" transform="rotate(-5 175 45)" fill="url(#fry)"/>
  <rect x="210" y="48" width="18" height="130" rx="3" transform="rotate(8 210 48)" fill="url(#fry)"/>
  <rect x="240" y="65" width="18" height="115" rx="3" transform="rotate(18 240 65)" fill="url(#fry)"/>
  
  <!-- Front fries -->
  <rect x="160" y="70" width="18" height="110" rx="3" transform="rotate(-10 160 70)" fill="#FFCA28"/>
  <rect x="190" y="60" width="18" height="120" rx="3" transform="rotate(2 190 60)" fill="#FFD54F"/>
  <rect x="225" y="72" width="18" height="110" rx="3" transform="rotate(12 225 72)" fill="#FFCA28"/>
  <rect x="135" y="90" width="16" height="95" rx="3" transform="rotate(-22 135 90)" fill="#FFA000"/>
  <rect x="250" y="85" width="16" height="100" rx="3" transform="rotate(25 250 85)" fill="#FFA000"/>

  <!-- Red Fry Box -->
  <polygon points="125,145 275,145 260,255 140,255" fill="url(#box)"/>
  <path d="M125 145 Q200 175 275 145 Z" fill="#9B0D17"/>
  <!-- Logo Emblem on Box -->
  <circle cx="200" cy="205" r="24" fill="#FFB703"/>
  <path d="M188 200 Q200 190 212 200" stroke="#E63946" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M190 210 Q200 216 210 210" stroke="#E63946" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>