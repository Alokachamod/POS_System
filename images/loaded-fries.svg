<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262321"/>
      <stop offset="100%" stop-color="#141211"/>
    </linearGradient>
    <linearGradient id="carton" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5722"/>
      <stop offset="100%" stop-color="#d84315"/>
    </linearGradient>
    <linearGradient id="fryGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ffca28"/>
      <stop offset="100%" stop-color="#f57f17"/>
    </linearGradient>
    <linearGradient id="cheeseDip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bg5)"/>
  <circle cx="200" cy="150" r="115" fill="#ff9800" opacity="0.14"/>

  <g filter="url(#shadow5)">
    <!-- French Fries Stems (Background Layer) -->
    <rect x="155" y="70" width="14" height="110" rx="3" fill="url(#fryGold)" transform="rotate(-18 162 125)"/>
    <rect x="180" y="55" width="14" height="120" rx="3" fill="url(#fryGold)" transform="rotate(-6 187 115)"/>
    <rect x="205" y="52" width="15" height="125" rx="3" fill="url(#fryGold)" transform="rotate(5 212 114)"/>
    <rect x="230" y="65" width="14" height="115" rx="3" fill="url(#fryGold)" transform="rotate(16 237 122)"/>
    <rect x="135" y="90" width="13" height="95" rx="3" fill="url(#fryGold)" transform="rotate(-28 141 137)"/>
    <rect x="252" y="85" width="14" height="100" rx="3" fill="url(#fryGold)" transform="rotate(25 259 135)"/>

    <!-- French Fries Stems (Foreground Layer) -->
    <rect x="165" y="75" width="14" height="100" rx="3" fill="#ffd54f" transform="rotate(-12 172 125)"/>
    <rect x="192" y="68" width="15" height="105" rx="3" fill="#ffca28" transform="rotate(2 199 120)"/>
    <rect x="218" y="72" width="14" height="100" rx="3" fill="#ffd54f" transform="rotate(10 225 122)"/>
    <rect x="148" y="98" width="13" height="85" rx="3" fill="#ffca28" transform="rotate(-20 154 140)"/>
    <rect x="238" y="95" width="13" height="88" rx="3" fill="#ffca28" transform="rotate(18 244 139)"/>

    <!-- Red Fast Food Carton Box -->
    <path d="M 130 155 L 148 245 C 150 252, 250 252, 252 245 L 270 155 C 270 155, 200 170, 130 155 Z" fill="url(#carton)"/>
    <!-- Carton Front Lip/Curve -->
    <path d="M 130 155 Q 200 185 270 155 L 268 170 Q 200 200 132 170 Z" fill="#bf360c"/>

    <!-- GrillMaster POS "M" or Flame emblem on Box -->
    <circle cx="200" cy="208" r="18" fill="#ffffff" opacity="0.95"/>
    <path d="M 194 216 L 194 202 L 200 209 L 206 202 L 206 216" stroke="#ff5722" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Truffle Cheese Sauce Dripping over Carton -->
    <path d="M 145 160 Q 165 185 178 165 Q 192 192 205 167 Q 220 190 235 165 Q 248 180 255 160 Q 240 162 200 164 Q 160 162 145 160 Z" fill="url(#cheeseDip)"/>

    <!-- Truffle Bits & Parsley Chives Flakes -->
    <circle cx="175" cy="172" r="1.8" fill="#3e2723"/>
    <circle cx="185" cy="166" r="1.5" fill="#2e7d32"/>
    <circle cx="200" cy="174" r="1.8" fill="#3e2723"/>
    <circle cx="210" cy="170" r="1.5" fill="#2e7d32"/>
    <circle cx="225" cy="173" r="1.8" fill="#3e2723"/>
    <circle cx="160" cy="110" r="1.5" fill="#2e7d32"/>
    <circle cx="202" cy="100" r="1.5" fill="#2e7d32"/>
    <circle cx="230" cy="115" r="1.5" fill="#2e7d32"/>
  </g>
</svg>
